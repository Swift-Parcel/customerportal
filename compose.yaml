services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=customerportal'
      - 'POSTGRES_PASSWORD=mysecretisthebestsecret'
      - 'POSTGRES_USER=customerportal'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
    volumes:
      - 'redis-data:/data'

volumes:
  postgres-data:
  redis-data:
