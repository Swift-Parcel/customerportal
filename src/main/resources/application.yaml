spring:
  application:
    name: customerportal

  datasource:
    url: jdbc:postgresql://localhost:32775/customerportal
    username: customerportal
    password: mysecretisthebestsecret
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui-custom.html
    operationsSorter: method
