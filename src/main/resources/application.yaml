spring:
  application:
    name: customerportal
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui-custom.html
    operationsSorter: method

external:
  api:
    backoffice-url: ${BACKOFFICE_API_URL:https://api-integration.free.beeceptor.com/api/integration/parcel}