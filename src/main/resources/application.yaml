spring:
  application:
    name: customerportal
  datasource:
    url: jdbc:postgresql://localhost:32775/customerportal
    username: customerportal
    password: mysecretisthebestsecret
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  error:
    include-stacktrace: never


app:
  jwt:
    issuer: swiftparcel-customer-portal
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-0123456789}
    access-token-ttl: PT15M


